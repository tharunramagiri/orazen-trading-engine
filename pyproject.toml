[build-system]
requires = ["setuptools >= 64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orazen-trading-engine"
dynamic = ["version"]

authors = [
  {name = "Orazen Team"},
  {name = "Orazen Team", email = "info@orazen.online"},
]

description = "Orazen Trading Engine — Agentic AI Trading Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPLv3"}
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.scripts]
orazen = "orazen.main:main"

[project.urls]
Homepage = "https://github.com/tharunramagiri/orazen-trading-engine"
Documentation = "https://orazen-trading-engine.readthedocs.io"
Repository = "https://github.com/tharunramagiri/orazen-trading-engine"
